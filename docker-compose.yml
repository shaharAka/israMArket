# IsraMarket — single-host deployment.
#
# Only the web tier publishes a port. The API stays on the internal network, which is
# what the rate limiter's TRUST_FORWARDED_FOR assumption and the (disabled) API docs
# both depend on.
#
# Copy .env.example to .env and fill it in first. The API refuses to start with the
# default JWT_SECRET when ENVIRONMENT=production.
services:
  api:
    build: ./api
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?set TOKEN_ENCRYPTION_KEY in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-3.1-flash-image}
      GEMINI_IMAGE_SIZE: ${GEMINI_IMAGE_SIZE:-1K}
      IMAGE_GENERATE_PROVIDER: ${IMAGE_GENERATE_PROVIDER:-muse}
      IMAGE_EDIT_PROVIDER: ${IMAGE_EDIT_PROVIDER:-muse}
      IMAGE_FALLBACK_MODEL: ${IMAGE_FALLBACK_MODEL:-gemini-3.1-flash-image}
      # Muse Image (and the Muse Spark experiment). Blank = every image goes to the fallback.
      META_MODEL_API_KEY: ${META_MODEL_API_KEY:-}
      REAL_PHOTO_FIRST: ${REAL_PHOTO_FIRST:-true}
      # The browser reaches the app on this origin, so OAuth redirects and the CSRF
      # origin check must match it exactly (scheme included).
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN in .env}
      API_ORIGIN: ${API_ORIGIN:-http://localhost:8000}
      # WhatsApp tracked links are printed as {PUBLIC_BASE_URL}/r/{code}; blank = WEB_ORIGIN.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      DATABASE_URL: sqlite:////app/data/isramarket.db
    volumes:
      # The database AND every generated card image live here. Losing this volume loses
      # customer data and artwork, so back it up.
      - api-data:/app/data

  web:
    build: ./web
    restart: unless-stopped
    environment:
      # Server-side only (the /backend proxy route reads it at request time), so it
      # points at the compose service name, never at the browser.
      API_ORIGIN: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
